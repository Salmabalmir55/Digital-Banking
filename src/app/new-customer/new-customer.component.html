<div class="page">
  <div class="page-header">
    <a routerLink="/admin/customers" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Customers
    </a>
  </div>

  <div *ngIf="!authService.hasRole('ADMIN')" class="alert alert-warning">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    You don't have permission to create customers. Please contact an administrator.
  </div>

  <div class="form-container" *ngIf="authService.hasRole('ADMIN')">
    <div class="form-card">
      <div class="form-card-header">
        <div class="header-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a8 8 0 0113 0"/><circle cx="19" cy="18" r="3" fill="currentColor" stroke="none"/><path d="M19 16.5v3M17.5 18h3" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>
        </div>
        <div>
          <h1>New Customer</h1>
          <p class="subtitle">Add a new customer to the system</p>
        </div>
      </div>

      <div class="alert success" *ngIf="successMsg">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        {{ successMsg }}
      </div>
      <div class="alert error" *ngIf="errorMsg">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        {{ errorMsg }}
      </div>

      <div class="form-body">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input id="name" type="text" [(ngModel)]="customer.name" class="form-input" placeholder="e.g. Mohamed Alami"/>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input id="email" type="email" [(ngModel)]="customer.email" class="form-input" placeholder="e.g. m.alami@example.com"/>
        </div>

        <div class="form-preview" *ngIf="customer.name || customer.email">
          <div class="preview-label">Preview</div>
          <div class="preview-card">
            <div class="preview-avatar">{{ customer.name.charAt(0).toUpperCase() }}</div>
            <div>
              <div class="preview-name">{{ customer.name || '—' }}</div>
              <div class="preview-email">{{ customer.email || '—' }}</div>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn-ghost" (click)="reset()" type="button">Reset</button>
          <button class="btn-primary" (click)="submit()" [disabled]="loading">
            <span *ngIf="!loading">Create Customer</span>
            <span *ngIf="loading">Creating...</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
