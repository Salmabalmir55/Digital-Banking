<div class="page">
  <div class="page-header">
    <div>
      <h1>Customers</h1>
      <p class="subtitle">Manage your customers</p>
    </div>
    <a routerLink="/admin/new-customer" class="btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      New Customer
    </a>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" placeholder="Search by name or email..." class="search-input"
             [(ngModel)]="searchKeyword" (ngModelChange)="searchCustomers()"/>
    </div>
  </div>

  <div class="loading-state" *ngIf="loading">
    <div class="spinner"></div>
    <p>Loading customers...</p>
  </div>

  <div class="table-wrap" *ngIf="!loading">
    <table class="data-table">
      <thead>
      <tr>
        <th>Customer</th>
        <th>Email</th>
        <th>ID</th>
        <th class="th-actions">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let customer of customers | async">
        <td>
          <div class="cell-customer">
            <div class="avatar" [style.background]="getAvatarColor(customer.name)">
              {{ customer.name.charAt(0).toUpperCase() }}
            </div>
            <span class="cname">{{ customer.name }}</span>
          </div>
        </td>
        <td class="cell-email">{{ customer.email }}</td>
        <td class="cell-id">#{{ customer.id }}</td>
        <td class="cell-actions">
          <button class="icon-btn edit" (click)="editCustomer(customer)" title="Edit">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 3l4 4-7 7H10v-4l7-7z"/>
              <path d="M4 20h16"/>
            </svg>
          </button>
          <button class="icon-btn delete" (click)="deleteCustomer(customer)" title="Delete">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M8 6V4h8v2"/>
              <line x1="10" y1="11" x2="10" y2="17"/>
              <line x1="14" y1="11" x2="14" y2="17"/>
            </svg>
          </button>
        </td>
      </tr>
      <tr *ngIf="(customers | async)?.length === 0">
        <td colspan="4" class="empty-state">No customers found</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
